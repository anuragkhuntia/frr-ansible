---
# Main FRR Deployment Playbook
# Run with tags to control execution:
#   ansible-playbook -i inventory.ini main.yml --tags discover
#   ansible-playbook -i inventory.ini main.yml --tags deploy
#   ansible-playbook -i inventory.ini main.yml --tags all

- name: Discover Network Interfaces
  hosts: all
  become: yes
  gather_facts: yes
  tags:
    - discover
    - never  # Only runs when explicitly tagged
  
  tasks:
    - name: Get list of bonded interfaces
      shell: |
        if [ -d /sys/class/net/bonding_masters ]; then
          cat /proc/net/bonding/bond* 2>/dev/null | grep "Slave Interface" | awk '{print $3}' || true
        fi
      register: bonded_interfaces_raw
      changed_when: false
      failed_when: false

    - name: Get list of prov_bond child interfaces
      shell: |
        if [ -d /sys/class/net ]; then
          for bond in /sys/class/net/prov_bond*/bonding/slaves 2>/dev/null; do
            [ -f "$bond" ] && cat "$bond" | tr ' ' '\n'
          done || true
        fi
      register: prov_bond_interfaces_raw
      changed_when: false
      failed_when: false

    - name: Set bonded interfaces list
      set_fact:
        bonded_interfaces: "{{ bonded_interfaces_raw.stdout_lines | default([]) }}"

    - name: Set prov_bond child interfaces list
      set_fact:
        prov_bond_interfaces: "{{ prov_bond_interfaces_raw.stdout_lines | default([]) }}"

    - name: Display all network interfaces
      debug:
        msg: "All interfaces: {{ ansible_interfaces }}"

    - name: Display bonded interfaces
      debug:
        msg: "Bonded interfaces (excluded): {{ bonded_interfaces }}"

    - name: Display prov_bond child interfaces
      debug:
        msg: "prov_bond child interfaces (excluded): {{ prov_bond_interfaces }}"

    - name: Identify eligible interfaces (UP and not bonded)
      set_fact:
        eligible_interfaces: >-
          {{
            ansible_interfaces 
            | map('regex_replace', '^(.*)$', 'ansible_' + '\1')
            | map('extract', hostvars[inventory_hostname])
            | selectattr('type', 'defined')
            | rejectattr('device', 'in', ['lo', 'bonding_masters'])
            | rejectattr('device', 'in', bonded_interfaces)
            | rejectattr('device', 'in', prov_bond_interfaces)
            | selectattr('active', 'defined')
            | selectattr('active', 'equalto', true)
            | rejectattr('ipv4', 'defined')
            | map(attribute='device')
            | list
          }}

    - name: Display eligible interfaces summary
      debug:
        msg:
          - "========================================="
          - "Host: {{ inventory_hostname }}"
          - "Eligible interfaces (UP, not bonded, no IP): {{ eligible_interfaces }}"
          - "First interface: {{ eligible_interfaces[0] | default('NONE') }}"
          - "Second interface: {{ eligible_interfaces[1] | default('NONE') }}"
          - "========================================="

    - name: Check if sufficient interfaces are available
      debug:
        msg: "✓ Found {{ eligible_interfaces | length }} eligible interfaces - sufficient for FRR deployment"
      when: eligible_interfaces | length >= 2

    - name: Warn if insufficient interfaces
      debug:
        msg: "✗ WARNING: Only {{ eligible_interfaces | length }} eligible interface(s) found. Need at least 2 for FRR."
      when: eligible_interfaces | length < 2

- name: Deploy FRR Configuration
  hosts: all
  become: yes
  vars_files:
    - vars/frr_vars.yml
  tags:
    - deploy
    - always  # Runs by default unless --tags is used
  
  tasks:
    - name: Gather network interface facts
      setup:
        gather_subset:
          - network

    - name: Get list of bonded interfaces
      shell: |
        if [ -d /sys/class/net/bonding_masters ]; then
          cat /proc/net/bonding/bond* 2>/dev/null | grep "Slave Interface" | awk '{print $3}' || true
        fi
      register: bonded_interfaces_raw
      changed_when: false
      failed_when: false

    - name: Get list of prov_bond child interfaces
      shell: |
        if [ -d /sys/class/net ]; then
          for bond in /sys/class/net/prov_bond*/bonding/slaves 2>/dev/null; do
            [ -f "$bond" ] && cat "$bond" | tr ' ' '\n'
          done || true
        fi
      register: prov_bond_interfaces_raw
      changed_when: false
      failed_when: false

    - name: Set bonded interfaces list
      set_fact:
        bonded_interfaces: "{{ bonded_interfaces_raw.stdout_lines | default([]) }}"

    - name: Set prov_bond child interfaces list
      set_fact:
        prov_bond_interfaces: "{{ prov_bond_interfaces_raw.stdout_lines | default([]) }}"

    - name: Identify eligible interfaces (UP and not bonded)
      set_fact:
        eligible_interfaces: >-
          {{
            ansible_interfaces 
            | map('regex_replace', '^(.*)$', 'ansible_' + '\1')
            | map('extract', hostvars[inventory_hostname])
            | selectattr('type', 'defined')
            | rejectattr('device', 'in', ['lo', 'bonding_masters'])
            | rejectattr('device', 'in', bonded_interfaces)
            | rejectattr('device', 'in', prov_bond_interfaces)
            | selectattr('active', 'defined')
            | selectattr('active', 'equalto', true)
            | rejectattr('ipv4', 'defined')
            | map(attribute='device')
            | list
          }}

    - name: Display discovered interfaces
      debug:
        msg: "Eligible interfaces found (UP, not bonded, no IP): {{ eligible_interfaces }}"

    - name: Auto-select interfaces if not defined in vars
      set_fact:
        frr_interface1: "{{ frr_hosts[inventory_hostname].interface1 | default(eligible_interfaces[0] | default('')) }}"
        frr_interface2: "{{ frr_hosts[inventory_hostname].interface2 | default(eligible_interfaces[1] | default('')) }}"
      when: eligible_interfaces | length >= 2

    - name: Fail if insufficient interfaces found
      fail:
        msg: "Need at least 2 eligible interfaces. Found: {{ eligible_interfaces | length }}"
      when: 
        - eligible_interfaces | length < 2
        - frr_hosts[inventory_hostname].interface1 is not defined

    - name: Display selected interfaces
      debug:
        msg: 
          - "Interface 1: {{ frr_interface1 }}"
          - "Interface 2: {{ frr_interface2 }}"

    - name: Ensure FRR is installed
      apt:
        name: frr
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Deploy FRR configuration
      template:
        src: templates/frr.conf.j2
        dest: /etc/frr/frr.conf
        owner: frr
        group: frr
        mode: '0640'
        backup: yes
      notify: Restart FRR

    - name: Enable FRR daemons
      template:
        src: templates/daemons.j2
        dest: /etc/frr/daemons
        owner: frr
        group: frr
        mode: '0640'
      notify: Restart FRR

    - name: Ensure FRR service is enabled and started
      systemd:
        name: frr
        state: started
        enabled: yes

  handlers:
    - name: Restart FRR
      systemd:
        name: frr
        state: restarted

---
# GitLab CI/CD Pipeline for FRR Ansible Deployment

stages:
  - validate
  - test
  - deploy-staging
  - deploy-production

variables:
  ANSIBLE_FORCE_COLOR: "true"
  ANSIBLE_HOST_KEY_CHECKING: "false"

# Default settings for all jobs
default:
  image: cytopia/ansible:latest
  before_script:
    - ansible --version
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      if [ -n "$SSH_PRIVATE_KEY" ]; then
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
      fi

# Validate Ansible syntax
syntax-check:
  stage: validate
  script:
    - ansible-playbook -i inventory.ini main.yml --syntax-check
  tags:
    - docker

# Validate YAML files
yaml-lint:
  stage: validate
  image: cytopia/yamllint:latest
  script:
    - yamllint -c .yamllint.yml .
  allow_failure: true
  tags:
    - docker

# Ansible lint check
ansible-lint:
  stage: validate
  script:
    - ansible-lint main.yml || true
  allow_failure: true
  tags:
    - docker

# Dry run test - Check mode
dry-run:
  stage: test
  script:
    - ansible-playbook -i inventory.ini main.yml --check --diff
  when: manual
  tags:
    - docker

# Deploy to specific host (manual)
deploy-single-host:
  stage: test
  script:
    - |
      if [ -z "$TARGET_HOST" ]; then
        echo "ERROR: TARGET_HOST variable not set"
        exit 1
      fi
    - ansible-playbook -i inventory.ini main.yml --limit "$TARGET_HOST" --check --diff
  when: manual
  variables:
    TARGET_HOST: ""
  tags:
    - docker

# Deploy to staging environment
deploy-staging:
  stage: deploy-staging
  script:
    - echo "Deploying to staging servers..."
    - ansible-playbook -i inventory.ini main.yml --limit "z1scuti03"
  environment:
    name: staging
    action: start
  when: manual
  only:
    - develop
    - main
  tags:
    - docker

# Deploy to production - all app-servers
deploy-production:
  stage: deploy-production
  script:
    - echo "Deploying to production servers..."
    - ansible-playbook -i inventory.ini main.yml
  environment:
    name: production
    action: start
  when: manual
  only:
    - main
  tags:
    - docker

# Deploy to production with confirmation
deploy-production-confirmed:
  stage: deploy-production
  script:
    - echo "Deploying to production with confirmation..."
    - ansible-playbook -i inventory.ini main.yml
  environment:
    name: production
    action: start
  when: manual
  only:
    - tags
  allow_failure: false
  tags:
    - docker
